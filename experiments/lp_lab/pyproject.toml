[project]
name = "lp-lab"
version = "0.1.0"
description = "Lifted-product (non-BB) qLDPC code discovery lab: search, distance, layout, syndrome circuits."
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "networkx>=3.2,<4",
  "stim>=1.13",
  "pynauty>=2.8",
  "python-sat[pblib,aiger]>=1.8.dev17",
  "pycryptosat>=5.14,<6",
  "scipy>=1.11",
  "pyyaml>=6.0,<7",
  "bb-lab",
]

[tool.uv.sources]
bb-lab = { path = "../bb_lab", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lp_lab"]
